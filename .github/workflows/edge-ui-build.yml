name: Edge UI Build (Fork)

# Builds the Edge-UI-instrumented Reynard app on a fork. Replays the
# edge-ui.patch instrumentation on top of the checked-out source before
# compiling, so it stays correct after each upstream sync.
#
# The upstream `build.yml` repo-owner gate only runs on minh-ton's repo, so this
# workflow is the fork's entry point. It triggers on workflow_dispatch (button
# in the Actions tab) or on a push to the `edge-ui` branch.
#
# Build variants are controlled by the input toggles (standard IPA + TrollStore
# TIPA, and the Jailbroken IPA).

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream (minh-ton/reynard-browser) branch, tag or commit to patch (empty = the pinned base below)
        required: false
        default: ''
        type: string
      app_only:
        description: 只构建 App：跳过引擎编译，直接用缓存里上次编好的引擎（引擎补丁没改时用）
        required: false
        default: false
        type: boolean
      runner:
        description: macOS runner image (macos-26 is often out of capacity)
        required: false
        default: macos-15-intel
        type: choice
        options: [macos-15-intel, macos-15, macos-26, macos-14]
      build_normal_ipa:
        description: Build normal IPA
        required: false
        default: true
        type: boolean
      build_trollstore_tipa:
        description: Build TrollStore TIPA
        required: false
        default: true
        type: boolean
      build_jailbroken_ipa:
        description: Build Jailbroken IPA
        required: false
        default: false
        type: boolean
  push:
    branches: [edge-ui]

permissions:
  contents: read

jobs:
  prepare:
    name: Select build variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_build: ${{ steps.matrix.outputs.should_build }}
    steps:
      - name: Select matrix
        id: matrix
        uses: actions/github-script@v9
        env:
          BUILD_NORMAL_IPA: ${{ inputs.build_normal_ipa }}
          BUILD_TROLLSTORE_TIPA: ${{ inputs.build_trollstore_tipa }}
          BUILD_JAILBROKEN_IPA: ${{ inputs.build_jailbroken_ipa }}
          RUN_PUSH_BUILD: ${{ github.event_name == 'push' }}
        with:
          script: |
            const variants = [];
            // A push always builds just the standard variant (which produces
            // the TrollStore .tipa). The Jailbroken IPA needs the nojemalloc
            // engine and is only built when explicitly requested via the
            // manual "Build Jailbroken IPA" input.
            const buildStandard = process.env.RUN_PUSH_BUILD === 'true' ||
              process.env.BUILD_TROLLSTORE_TIPA === 'true';
            const buildNoJemalloc = process.env.BUILD_JAILBROKEN_IPA === 'true';
            if (buildStandard) {
              variants.push({
                variant: 'standard',
                // --disable-lto: the LTO link alone needs several hours on the
                // 3-core GitHub-hosted runners and blew past the 6h job cap, so
                // CI links without LTO. Pass --enable-lto locally for a
                // fully-optimised build.
                // Keep --auto-clobber: a cached Gecko objdir can go stale between
                // Firefox merge days, and mach refuses to build without
                // clobbering. With the object cache restored, a Swift-only change
                // makes `mach build` an incremental compile (near no-op); the
                // clobber only fires when the Gecko source's merge day changes.
                build_args: '--use-sccache --auto-clobber --disable-lto',
                sccache_namespace: 'standard',
              });
            }
            if (buildNoJemalloc) {
              variants.push({
                variant: 'nojemalloc',
                build_args: '--disable-jemalloc --use-sccache --auto-clobber --disable-lto',
                sccache_namespace: 'nojemalloc',
              });
            }
            core.setOutput('matrix', JSON.stringify({ include: variants }));
            core.setOutput('should_build', String(variants.length > 0));

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    name: "${{ matrix.variant == 'standard' && 'Build Standard / TrollStore' || 'Build Jailbroken' }}"
    # macos-26 runners were repeatedly unavailable (jobs cancelled after
    # 15 min in the queue, macos-15 too), so pushes build on Intel macos-15-intel.
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ${{ matrix.sccache_namespace }}

    steps:
      # Host tools in the object tree / toolchains are per CPU type: an
      # Apple Silicon cache can't run on an Intel runner ("Bad CPU type").
      # (The runner context isn't allowed in job-level env, so set it here.)
      - name: Separate sccache namespace per CPU type
        run: echo "SCCACHE_GHA_VERSION=${{ matrix.sccache_namespace }}-${{ runner.arch }}" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch upstream Reynard
        run: |
          git remote add upstream https://github.com/minh-ton/reynard-browser.git 2>/dev/null || true
          git fetch --no-tags upstream "${UPSTREAM_REF}"
        env:
          # Pinned to the upstream commit edge-ui was last merged with, so an
          # upstream refactor can't break pushes before it has been merged.
          # Bump this together with each upstream merge.
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'a8b89d480c2f6b4d90b7ecee6abd3bf582fc8e3c' }}

      # Reset browser/, engine/ and patches/ to the upstream revision and replay
      # tools/edge-ui on top. This proves on every build that the customisation
      # is still a clean patch over upstream, rather than building the fork's
      # already-edited sources.
      - name: Replay Edge UI patch onto upstream
        run: sh ./tools/development/apply-edge-ui.sh --non-interactive --from-upstream FETCH_HEAD

      - name: Show upstream revision
        run: git log -1 --format='Upstream base %h %s' FETCH_HEAD

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install build dependencies
        run: |
          # --overwrite: Intel images ship a Python whose /usr/local/bin links
          # would otherwise make `brew link` fail.
          brew install --overwrite python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Update Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      # A fresh checkout stamps every source file (and CLOBBER) with the
      # current time, so a restored object tree always looked stale: mach
      # auto-clobbered it and rebuilt the whole engine, which then ran out of
      # time. Give unchanged sources a fixed old date and only the files the
      # patches changed or added the current time, so the restored objects are
      # reused and just the patched parts recompile.
      - name: Normalise Gecko source timestamps
        working-directory: engine/firefox
        run: |
          git ls-files -z | xargs -0 touch -h -t 202001010000
          git diff --name-only -z HEAD | xargs -0 touch -h || true
          git ls-files -z --others --exclude-standard | xargs -0 touch -h || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: edgeui-buildcache-gecko-deps-${{ matrix.variant }}-${{ runner.arch }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: |
            edgeui-buildcache-gecko-deps-${{ matrix.variant }}-${{ runner.arch }}-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: |
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: edgeui-buildcache-idevice-${{ runner.arch }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('support/idevice/Cargo.lock', 'support/idevice/Cargo.toml', 'tools/development/build-idevice.sh') }}
          restore-keys: |
            edgeui-buildcache-idevice-${{ runner.arch }}-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Cache the compiled Gecko engine object tree. It only depends on the
      # Gecko source + the engine patches (never on browser/ Swift), so a
      # Swift-only change reuses this cache and `./mach build` becomes an
      # incremental compile instead of a full ~2-3h rebuild. --auto-clobber is
      # kept so a genuine Gecko merge-day change still wipes + rebuilds safely.
      # Restore and save are split so a partial build is kept: if the engine
      # build runs out of time, the half-built object tree is still saved
      # (see "Save Gecko object cache") and the next run resumes from it.
      # Every save uses a unique key; the prefix restore picks the newest.
      - name: Restore Gecko object cache
        id: gecko_obj_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/firefox/obj-aarch64-apple-ios
            !engine/firefox/obj-aarch64-apple-ios/.mozbuild/logs
          key: edgeui-buildcache-gecko-obj-${{ matrix.variant }}-${{ runner.arch }}-${{ hashFiles('engine/release.txt') }}-${{ hashFiles('patches/**/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            edgeui-buildcache-gecko-obj-${{ matrix.variant }}-${{ runner.arch }}-${{ hashFiles('engine/release.txt') }}-${{ hashFiles('patches/**/*.patch') }}-
            edgeui-buildcache-gecko-obj-${{ matrix.variant }}-${{ runner.arch }}-${{ hashFiles('engine/release.txt') }}-

      # Skip the engine when the restored object tree is a *finished* build of
      # exactly this engine source (same Firefox release + same engine
      # patches; marker written after a successful build), or when the run
      # was started with "app_only". Only the app is compiled then.
      - name: Check for a finished engine build
        id: engine_check
        env:
          ENGINE_KEY: ${{ hashFiles('engine/release.txt') }}-${{ hashFiles('patches/**/*.patch') }}
          APP_ONLY: ${{ inputs.app_only }}
        run: |
          marker=engine/firefox/obj-aarch64-apple-ios/.edge-engine-complete
          if [ "$APP_ONLY" = "true" ]; then
            echo "::notice::app_only: skipping the engine build, using the cached engine as is."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$marker" ] && [ "$(cat "$marker")" = "$ENGINE_KEY" ]; then
            echo "::notice::Cached engine is a finished build of this exact engine source; skipping the engine build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Gecko
        id: gecko_build
        if: ${{ steps.engine_check.outputs.skip != 'true' }}
        # The step stops the compile itself at 270 min (see below), leaving
        # time to save the partial object tree; the job then fails and a
        # re-run continues. timeout-minutes is only a last-resort backstop:
        # when it fires, GitHub kills just this shell while the compilers keep
        # writing, and the cache save fails ("file changed as we read it").
        timeout-minutes: 300
        continue-on-error: true
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: |
          # mach announces completion through `terminal-notifier`, and that
          # helper can hang on a headless runner. When it does, the step stays
          # open long after the compile finished and the job dies on the 6 h
          # cap. Shadow it with a no-op stub, and stream the build through a
          # log file so no stray child can hold this step's stdout open.
          mkdir -p "$RUNNER_TEMP/no-notifier"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/no-notifier/terminal-notifier"
          chmod +x "$RUNNER_TEMP/no-notifier/terminal-notifier"
          export PATH="$RUNNER_TEMP/no-notifier:$PATH"
          # Job control on: the build gets its own process group, so the whole
          # compile (mach, make, clang, rustc...) can be stopped together.
          set -m
          ./tools/development/build-gecko.sh ${{ matrix.build_args }} > "$RUNNER_TEMP/gecko-build.log" 2>&1 &
          build_pid=$!
          set +m
          tail -n +1 -f "$RUNNER_TEMP/gecko-build.log" &
          tail_pid=$!
          set +e
          deadline=$((SECONDS + 270 * 60))
          timed_out=false
          while kill -0 "$build_pid" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              timed_out=true
              echo "::warning::Engine build reached its time budget; stopping it so the progress can be cached."
              kill -TERM -- "-$build_pid" 2>/dev/null
              for _ in $(seq 1 60); do
                kill -0 "$build_pid" 2>/dev/null || break
                sleep 2
              done
              kill -KILL -- "-$build_pid" 2>/dev/null
              # Anything that escaped the process group must not keep writing
              # into the object tree while it is being archived.
              pkill -KILL -f 'obj-aarch64-apple-ios' 2>/dev/null
              for p in make clang clang++ rustc cargo ld64.lld; do pkill -KILL -x "$p" 2>/dev/null; done
              break
            fi
            sleep 15
          done
          wait "$build_pid" 2>/dev/null
          build_status=$?
          sccache --stop-server >/dev/null 2>&1
          sleep 5
          kill "$tail_pid" 2>/dev/null
          wait "$tail_pid" 2>/dev/null
          if [ "$timed_out" = true ]; then
            exit 124
          fi
          exit "$build_status"

      - name: Mark the engine build as finished
        if: ${{ steps.gecko_build.outcome == 'success' }}
        env:
          ENGINE_KEY: ${{ hashFiles('engine/release.txt') }}-${{ hashFiles('patches/**/*.patch') }}
        run: printf '%s' "$ENGINE_KEY" > engine/firefox/obj-aarch64-apple-ios/.edge-engine-complete

      - name: Save Gecko object cache
        if: ${{ always() && steps.gecko_build.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: |
            engine/firefox/obj-aarch64-apple-ios
            !engine/firefox/obj-aarch64-apple-ios/.mozbuild/logs
          key: ${{ steps.gecko_obj_cache.outputs.cache-primary-key }}

      - name: Stop if the engine build did not finish
        if: ${{ steps.gecko_build.outcome == 'failure' }}
        run: |
          echo "::error::Gecko build did not finish (timed out or failed). Progress was cached: re-run this workflow to continue from where it stopped."
          exit 1

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Install packaging dependencies
        run: brew install ldid

      - name: Build app
        run: ./tools/release/build-app.sh --no-signing

      - name: Create TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && (github.event_name != 'workflow_dispatch' || inputs.build_trollstore_tipa) }}
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Create Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && (github.event_name != 'workflow_dispatch' || inputs.build_jailbroken_ipa) }}
        run: ./tools/release/create-ipa.sh --jailbroken

      - name: Upload TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && (github.event_name != 'workflow_dispatch' || inputs.build_trollstore_tipa) }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore.tipa
          path: dist/Reynard-TrollStore.tipa
          if-no-files-found: error

      - name: Upload Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && (github.event_name != 'workflow_dispatch' || inputs.build_jailbroken_ipa) }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Jailbroken.ipa
          path: dist/Reynard-Jailbroken.ipa
          if-no-files-found: error
