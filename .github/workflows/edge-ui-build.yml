name: Edge UI Build (Fork)

# Builds the Edge-UI-instrumented Reynard app on a fork. Replays the
# edge-ui.patch instrumentation on top of the checked-out source before
# compiling, so it stays correct after each upstream sync.
#
# The upstream `build.yml` repo-owner gate only runs on minh-ton's repo, so this
# workflow is the fork's entry point. It triggers on workflow_dispatch (button
# in the Actions tab) or on a push to the `edge-ui` branch.
#
# Build variants are controlled by the input toggles (standard IPA + TrollStore
# TIPA, and the Jailbroken IPA).

on:
  workflow_dispatch:
    inputs:
      build_normal_ipa:
        description: Build normal IPA
        required: false
        default: true
        type: boolean
      build_trollstore_tipa:
        description: Build TrollStore TIPA
        required: false
        default: true
        type: boolean
      build_jailbroken_ipa:
        description: Build Jailbroken IPA
        required: false
        default: false
        type: boolean
  push:
    branches: [edge-ui]

permissions:
  contents: read

jobs:
  prepare:
    name: Select build variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_build: ${{ steps.matrix.outputs.should_build }}
    steps:
      - name: Select matrix
        id: matrix
        uses: actions/github-script@v9
        env:
          BUILD_NORMAL_IPA: ${{ inputs.build_normal_ipa }}
          BUILD_TROLLSTORE_TIPA: ${{ inputs.build_trollstore_tipa }}
          BUILD_JAILBROKEN_IPA: ${{ inputs.build_jailbroken_ipa }}
          RUN_PUSH_BUILD: ${{ github.event_name == 'push' }}
        with:
          script: |
            const variants = [];
            const buildStandard = process.env.RUN_PUSH_BUILD === 'true' ||
              process.env.BUILD_NORMAL_IPA === 'true' ||
              process.env.BUILD_TROLLSTORE_TIPA === 'true';
            const buildNoJemalloc = process.env.RUN_PUSH_BUILD === 'true' ||
              process.env.BUILD_JAILBROKEN_IPA === 'true';
            if (buildStandard) {
              variants.push({
                variant: 'standard',
                // No --auto-clobber: with the Gecko object cache restored, a
                // Swift-only change makes `mach build` an incremental compile
                // instead of wiping and rebuilding the whole engine each run.
                build_args: '--use-sccache',
                sccache_namespace: 'standard',
              });
            }
            if (buildNoJemalloc) {
              variants.push({
                variant: 'nojemalloc',
                build_args: '--disable-jemalloc --use-sccache',
                sccache_namespace: 'nojemalloc',
              });
            }
            core.setOutput('matrix', JSON.stringify({ include: variants }));
            core.setOutput('should_build', String(variants.length > 0));

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    name: "${{ matrix.variant == 'standard' && 'Build Standard / TrollStore' || 'Build Jailbroken' }}"
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ${{ matrix.sccache_namespace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Replay Edge UI instrumentation patch
        run: sh ./tools/development/apply-edge-ui.sh --non-interactive

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Update Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: edgeui-buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: |
            edgeui-buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-

      # Cache the compiled Gecko engine object tree. It only depends on the
      # Gecko source + the engine patches (never on browser/ Swift), so a
      # Swift-only change reuses this cache and `./mach build` becomes an
      # incremental compile instead of a full ~2-3h rebuild.
      - name: Restore Gecko object cache
        uses: actions/cache@v4
        with:
          path: engine/firefox/obj-aarch64-apple-ios
          key: edgeui-buildcache-gecko-obj-${{ matrix.variant }}-${{ hashFiles('engine/release.txt') }}-${{ hashFiles('patches/**/*.patch') }}
          restore-keys: |
            edgeui-buildcache-gecko-obj-${{ matrix.variant }}-${{ hashFiles('engine/release.txt') }}-

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: |
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: edgeui-buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('support/idevice/Cargo.lock', 'support/idevice/Cargo.toml', 'tools/development/build-idevice.sh') }}
          restore-keys: |
            edgeui-buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build Gecko
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: ./tools/development/build-gecko.sh ${{ matrix.build_args }}

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Install packaging dependencies
        run: brew install ldid

      - name: Build app
        run: ./tools/release/build-app.sh --no-signing

      - name: Create IPA
        if: ${{ matrix.variant == 'standard' && (github.event_name != 'workflow_dispatch' || inputs.build_normal_ipa) }}
        run: ./tools/release/create-ipa.sh

      - name: Create TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && (github.event_name != 'workflow_dispatch' || inputs.build_trollstore_tipa) }}
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Create Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && (github.event_name != 'workflow_dispatch' || inputs.build_jailbroken_ipa) }}
        run: ./tools/release/create-ipa.sh --jailbroken

      - name: Upload IPA
        if: ${{ matrix.variant == 'standard' && (github.event_name != 'workflow_dispatch' || inputs.build_normal_ipa) }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard.ipa
          path: dist/Reynard.ipa
          if-no-files-found: error

      - name: Upload TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && (github.event_name != 'workflow_dispatch' || inputs.build_trollstore_tipa) }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore.tipa
          path: dist/Reynard-TrollStore.tipa
          if-no-files-found: error

      - name: Upload Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && (github.event_name != 'workflow_dispatch' || inputs.build_jailbroken_ipa) }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Jailbroken.ipa
          path: dist/Reynard-Jailbroken.ipa
          if-no-files-found: error
